<!DOCTYPE html>
<html lang="en">
<head>

<title>Thamizhan Roleplay V2</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0,#4b146f 0,#170b27 38%,#07070b 75%)}

.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}a{display:inline-block;min-width:180px;padding:13px 20px;border-radius:10px;text-decoration:none;font-weight:700;color:#fff;background:#7b2bc2}a:hover{filter:brightness(1.15)}.discord{background:#5865f2}
